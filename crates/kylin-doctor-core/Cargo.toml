[package]
name = "kylin-doctor-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
dirs = "6"
futures-util = "0.3"
